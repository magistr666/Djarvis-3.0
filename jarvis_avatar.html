<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Jarvis Avatar</title>
<style>
  :root {
    --core-blue: #00b3ff;
    --core-glow: rgba(0, 170, 255, 0.9);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
  }
  /* --- Фото персонажа --- */
  .photo-wrap {
    position: absolute;
    inset: 0;
    transform-origin: 50% 12%;  /* голова примерно сверху */
  }
  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* --- Ядро на костюме --- */
  .core {
    position: absolute;
    left: 50%;
    top: 55%;
    width: 56px;
    height: 56px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #bff3ff 0%, #33c9ff 35%, #0077cc 80%);
    border: 2px solid #a8ecff;
    opacity: 0.9;
    z-index: 5;
    transition: box-shadow 0.4s, filter 0.4s, opacity 0.4s;
  }
  .core-ring {
    position: absolute;
    left: 50%;
    top: 55%;
    width: 56px;
    height: 56px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid var(--core-glow);
    opacity: 0;
    z-index: 4;
  }

  /* --- Руки (перчатки) --- */
  .hand {
    position: absolute;
    bottom: -30px;
    width: 120px;
    z-index: 6;
    transition: transform 0.5s ease, opacity 0.5s ease;
    opacity: 0;
    transform: translateY(90px);
  }
  .hand-left  { left: 6px;  transform-origin: 50% 100%; }
  .hand-right { right: 6px; transform-origin: 50% 100%; }

  /* ============ СОСТОЯНИЯ ============ */
  /* IDLE — лёгкое дыхание */
  .state-idle .photo-wrap {
    animation: idle-breathe 3.2s ease-in-out infinite;
  }
  .state-idle .hand { opacity: 0; transform: translateY(90px); }

  /* SPEAKING — голова и руки работают */
  .state-speaking .photo-wrap {
    animation: talk-head 1.5s ease-in-out infinite;
  }
  .state-speaking .hand-left {
    opacity: 1;
    animation: hand-wav-L 1.6s ease-in-out infinite;
  }
  .state-speaking .hand-right {
    opacity: 1;
    animation: hand-wav-R 1.6s ease-in-out infinite 0.2s;
  }

  /* MULTITOOL — ядро светит ярким синим */
  .state-multitool .core {
    box-shadow: 0 0 40px var(--core-glow), 0 0 90px var(--core-glow), inset 0 0 22px #fff;
    filter: brightness(1.4);
    animation: core-pulse 0.7s ease-in-out infinite;
  }
  .state-multitool .core-ring {
    opacity: 1;
    animation: ring-expand 1.1s ease-out infinite;
  }

  /* ============ КЛЮЧЕВЫЕ КАДРЫ ============ */
  @keyframes idle-breathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50%      { transform: scale(1.008) translateY(-3px); }
  }
  @keyframes talk-head {
    0%, 100% { transform: rotate(-1.2deg) translateY(0); }
    25%      { transform: rotate(1.0deg) translateY(-4px); }
    50%      { transform: rotate(-0.6deg) translateY(-2px); }
    75%      { transform: rotate(1.4deg) translateY(-5px); }
  }
  @keyframes hand-wav-L {
    0%, 100% { transform: translateY(-20px) rotate(-8deg); }
    50%      { transform: translateY(-45px) rotate(-20deg); }
  }
  @keyframes hand-wav-R {
    0%, 100% { transform: translateY(-20px) rotate(8deg); }
    50%      { transform: translateY(-45px) rotate(20deg); }
  }
  @keyframes core-pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-50%, -50%) scale(1.18); }
  }
  @keyframes ring-expand {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0.9; }
    100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
  }
</style>
</head>
<body class="state-idle">
  <div id="stage">
    <div class="photo-wrap">
      <img src="i.jpg" alt="Jarvis">
    </div>

    <div class="core-ring"></div>
    <div class="core"></div>

    <!-- Перчатки -->
    <svg class="hand hand-left" viewBox="0 0 120 160">
      <g fill="#1a2733" stroke="#00b3ff" stroke-width="2">
        <rect x="34" y="70" width="52" height="70" rx="14"/>
        <rect x="26" y="40" width="20" height="60" rx="10"/>
        <rect x="50" y="30" width="20" height="62" rx="10"/>
        <rect x="74" y="40" width="20" height="60" rx="10"/>
        <rect x="30" y="100" width="60" height="26" rx="12" fill="#0f2433" stroke="#00b3ff"/>
      </g>
    </svg>
    <svg class="hand hand-right" viewBox="0 0 120 160">
      <g fill="#1a2733" stroke="#00b3ff" stroke-width="2">
        <rect x="34" y="70" width="52" height="70" rx="14"/>
        <rect x="26" y="40" width="20" height="60" rx="10"/>
        <rect x="50" y="30" width="20" height="62" rx="10"/>
        <rect x="74" y="40" width="20" height="60" rx="10"/>
        <rect x="30" y="100" width="60" height="26" rx="12" fill="#0f2433" stroke="#00b3ff"/>
      </g>
    </svg>
  </div>

<script>
  let currentState = 'idle';

  function setIdle() {
    document.body.className = 'state-idle';
    currentState = 'idle';
  }

  function setState(s) {
    if (!s) return;
    s = s.toLowerCase();
    if (s === 'speaking' || s === 'multitool' || s === 'idle') {
      currentState = s;
      document.body.className = 'state-' + s;
    }
  }

  // Каждые 0.4 сек читаем /state.json
  async function pollState() {
    try {
      const r = await fetch('state.json?_=' + Date.now(), { cache: 'no-store' });
      const data = await r.json();
      if (data && data.state && data.state !== currentState) {
        setState(data.state);
      }
      if (currentState === 'speaking' && data && data.state === 'speaking') {
        const age = (Date.now() - (data.ts || 0) * 1000);
        if (age > 6000) setIdle();
      }
    } catch (e) {}
  }
  setInterval(pollState, 400);
</script>
</body>
</html>
